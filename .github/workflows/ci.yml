name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# A new push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every failing version, not just the first.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml, so a
      # dependency change cannot land without its lockfile.
      - name: Sync environment
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check

      - name: Formatting
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy

      # Corn and gasoline are not committed — see src/chemometrics_workbench/data/.
      # Cache them on their pinned checksums so CI downloads each one once, and
      # the parity datasets are genuinely checksum-asserted rather than skipped.
      - name: Cache downloaded reference datasets
        uses: actions/cache@v4
        with:
          path: ~/.cache/chemometrics-workbench/datasets
          key: reference-datasets-${{ hashFiles('src/chemometrics_workbench/data/*/SHA256SUMS') }}

      - name: Tests
        run: uv run pytest
        env:
          CHEMOMETRICS_DOWNLOAD_DATASETS: "1"

      # The report is regenerated so that a renderer which crashes, or a run
      # that did not cover every comparable entry, fails the build. It is
      # deliberately NOT byte-compared against the committed copy: claim tiers
      # at the 32-ulp boundary and last-bit differences are machine-dependent,
      # and two correct runners disagree on them (#38). What guards the
      # published claim instead is in the suite - the tolerances are frozen in
      # a test, and the committed report is checked against the fixture for
      # staleness.
      - name: Parity report regenerates
        run: uv run python -m tests.parity_report

  # The frontend is checked on its own job rather than inside the Python
  # matrix: nothing it does depends on the Python version, and running it twice
  # would only double the minutes.
  frontend:
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Never fail-fast: a failure on one platform is a fact about that
      # platform, and cancelling the others hides whether it is the only one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # The version comes from packageManager, so CI and a developer's corepack
      # shim install the same pnpm. The action reads the repository root by
      # default and the field lives in frontend/, hence the path.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # --frozen-lockfile fails if pnpm-lock.yaml is out of date with
      # package.json, the same gate uv sync --locked gives the Python side.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Chromium only. `--with-deps` installs the system libraries the browser
      # needs and is Linux-only - it is what apt-get would do, and there is
      # nothing for it to do on macOS or Windows, where it fails rather than
      # being ignored.
      - name: Install Playwright chromium (Linux)
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright chromium
        if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium

      # The end-to-end tests run against the real server serving the built
      # bundle - the same origin and the same token the packaged application
      # uses - so this job needs the Python environment too. It also seeds
      # three project directories through the kernels first; see
      # frontend/playwright.config.ts and tests/seed_e2e.py.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the server's environment
        working-directory: .
        run: uv sync --locked

      # Playwright reports a webServer that will not start as "exit code: 1"
      # and nothing else, and its stdout is in a log that needs credentials to
      # read. The seed is the first thing that command runs, so running it once
      # on its own turns that into a traceback - and into an annotation, which
      # is readable without signing in to Actions.
      - name: Seed smoke test
        shell: bash
        working-directory: .
        run: |
          set +e
          out=$(uv run python tests/seed_e2e.py --fresh --empty "${RUNNER_TEMP}/seed-smoke" 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            printf '::error title=Seed failed on %s::%s\n' "$RUNNER_OS" "$(echo "$out" | tr '\n' ' ' | tail -c 900)"
            exit $code
          fi

      # The seed runs; the webServer still does not. That leaves the server
      # itself, so this starts it exactly as playwright.config.ts does - same
      # environment, same module - and reports what it said either way. A
      # notice on success is worth as much as an error on failure here: it
      # says the server is not the problem.
      - name: Server smoke test
        shell: bash
        working-directory: .
        env:
          CHEMOMETRICS_PROJECT: ${{ runner.temp }}/smoke-project
          CHEMOMETRICS_CONFIG_HOME: ${{ runner.temp }}/smoke-config
          WORKBENCH_PORT: "8799"
          WORKBENCH_TOKEN: smoke-token
          WORKBENCH_BUNDLE: frontend/dist
        run: |
          set +e
          uv run python -m chemometrics_workbench.server > server.log 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 \
              -H "Authorization: Bearer smoke-token" http://127.0.0.1:8799/api/projects)
            [ "$code" = "200" ] && break
            kill -0 $pid 2>/dev/null || break
            sleep 2
          done
          kill $pid 2>/dev/null
          tail=$(tr '\n' ' ' < server.log | tail -c 900)
          if [ "$code" = "200" ]; then
            printf '::notice title=Server started on %s::/api/projects answered 200\n' "$RUNNER_OS"
          else
            printf '::error title=Server failed on %s::last status %s; %s\n' "$RUNNER_OS" "$code" "$tail"
            cat server.log
            exit 1
          fi

      # e2e/walkthrough.spec.ts is #50's exit criterion and Phase 1.2's (#90):
      # an empty project, a file the user picks, a pipeline built and saved,
      # a run, and a scores plot equal to what the server served. It runs on
      # all three platforms because the application is shipped on all three,
      # and a walkthrough that only ever ran on the runner it was written for
      # proves less than it appears to.
      - name: End-to-end
        run: pnpm test:e2e

      # The traces say which platform failed and where, which is the whole
      # reason for running three of them.
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
