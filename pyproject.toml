[project]
name = "chemometrics-workbench"
version = "0.0.0"
description = "Open-source, local-first chemometrics workbench"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Mallik" }]
dependencies = ["pydantic>=2.9"]

[project.urls]
Repository = "https://github.com/millermuttu/Chemometrics-Workbench"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemometrics_workbench"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"
# design/canvas holds a one-off generator for design artboards, not shipped code.
extend-exclude = ["design/canvas"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import sorting
  "UP",       # pyupgrade
  "B",        # bugbear
  "SIM",      # simplify
  "RUF",      # ruff-specific
]
# Prose in docstrings and field descriptions uses real typography (en dashes,
# times signs). RUF001 flags those as homoglyphs; here they are deliberate.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
