[project]
name = "chemometrics-workbench"
version = "0.1.0"
description = "Open-source, local-first chemometrics workbench"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Mallik" }]
dependencies = ["pydantic>=2.9", "numpy>=2.0", "scipy>=1.14"]

[project.urls]
Repository = "https://github.com/millermuttu/Chemometrics-Workbench"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemometrics_workbench"]

[dependency-groups]
# rdata reads the R .RData that carries the gasoline dataset. It is dev-only:
# the application never reads R files, only the parity work does.
# scikit-learn and chemotools are the open reference implementations the parity
# fixtures are generated against. Dev-only: our kernels do not call either, and
# docs/decisions/0001-chemotools.md is why chemotools is here and not shipped -
# it pulls scikit-learn in with it and carries 17 MB of example datasets.
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "rdata>=0.11",
  "scikit-learn>=1.5",
  "chemotools>=0.4.3",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "stub"]
target-version = "py312"
# design/canvas holds a one-off generator for design artboards, not shipped code.
extend-exclude = ["design/canvas"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import sorting
  "UP",       # pyupgrade
  "B",        # bugbear
  "SIM",      # simplify
  "RUF",      # ruff-specific
]
# Prose in docstrings and field descriptions uses real typography (en dashes,
# times signs). RUF001 flags those as homoglyphs; here they are deliberate.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["src", "tests", "stub"]
python_version = "3.12"
plugins = ["pydantic.mypy"]

# None of these ship type stubs.
[[tool.mypy.overrides]]
module = ["scipy.*", "rdata.*", "sklearn.*", "chemotools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "parity: a claim in the parity report. Run the suite alone with `pytest -m parity`.",
]
